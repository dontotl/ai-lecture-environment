[supervisord]
nodaemon=true
user=app

[program:api]
command=python3.9 -m uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
directory=/workspace
autorestart=true
priority=10

[program:frontend]
command=npm run dev -- --host 0.0.0.0 --port 5173
directory=/workspace/frontend
autorestart=true
priority=20
